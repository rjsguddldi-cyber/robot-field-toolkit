# motion_monitor 파라미터. 판정 숫자 확정: 11/20 (건형)
motion_monitor:
  ros__parameters:
    use_sim_time: true
    cmd_topic: cmd_vel_checked  # 인터락 통과 명령 (막힌 명령으로 E101이 뜨지 않게)
    wheel_cmd_topic: wheel_cmd  # 구동기 입력
    odom_topic: odom            # 실제 속도
    eval_rate: 10.0             # 판정 주기 [Hz]

    cmd_v_min: 0.05       # |v| 명령이 이보다 크면 '움직이라는 명령' [m/s]
    cmd_w_min: 0.1        # |w| 명령이 이보다 크면 '움직이라는 명령' [rad/s]
    stall_ratio: 0.2      # E101: 실제/명령 < 20%
    stall_time: 1.0       # E101: 지속 [s]
    weak_ratio: 0.7       # E102: 20% <= 실제/명령 < 70%
    weak_time: 2.0        # E102: 지속 [s]
    loss_window: 2.0      # E103: 수신 수를 세는 구간 [s]
    loss_ratio: 0.7       # E103: wheel_cmd 수 < cmd 수 x 70%
    loss_min_cmds: 5      # E103: 구간 안 명령이 이보다 적으면 판정 안 함
    straight_w_max: 0.05  # E104: |w| 명령 < 이 값이면 '직진 명령' [rad/s]
    drift_w: 0.15         # E104: 직진인데 실제 |w| > 이 값 [rad/s]
    drift_time: 1.5       # E104: 지속 [s]
    clear_time: 1.0       # 조건이 이만큼 계속 사라지면 해제 [s]
    odom_timeout: 0.5     # odom이 이보다 오래 없으면 E101/E102/E104 판정 보류 [s]
