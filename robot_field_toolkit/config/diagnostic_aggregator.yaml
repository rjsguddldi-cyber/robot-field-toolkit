# diagnostic_aggregator 설정: /diagnostics를 묶어서 /diagnostics_agg로 낸다.
diagnostic_aggregator:
  ros__parameters:
    use_sim_time: true
    pub_rate: 1.0
    analyzers:
      motion:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Motion                            # 구동 (E1xx)
        startswith: ['field_toolkit/motion']
      interlock:
        type: diagnostic_aggregator/GenericAnalyzer
        path: Interlock                         # 주행·팔 인터락 (E3xx)
        startswith: ['field_toolkit/interlock']
