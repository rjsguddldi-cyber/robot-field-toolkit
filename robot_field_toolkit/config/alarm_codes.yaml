# robot-field-toolkit 알람 코드표
# 형식: 코드 -> name, level, meaning, causes(원인 목록), checks(점검 순서, 돈·시간 안 드는 것부터)
# level (두산 협동로봇 정지 방식):
#   WARN      = 정지 안 함, 기록하고 계속
#   ALARM     = Soft Stop: 감속 정지 후 점검
#   EMERGENCY = Quick Stop: 즉시 정지, 수동 복구
# checks의 1번은 항상 "상태 표시 확인".
# 등급·점검 순서 확정: 11/20 (건형)

E101:
  name: 구동 정지
  level: ALARM
  meaning: 주행 명령이 있는데 실제 속도가 명령의 20% 미만인 상태가 1초 이상 계속됨
  causes:
    - 브레이크 미해제
    - 바퀴 고착 또는 이물질 끼임
    - 모터 드라이버 비활성 (서보 OFF, 비상정지 래치)
    - 구동기에 0 명령이 들어감 (상위 명령이 중간에서 바뀜)
    - 구동 전원 또는 모터 케이블 단선
  checks:
    - "상태 표시 확인: 드라이버 LED·에러 코드, 비상정지 버튼, fault_injector mode"
    - "브레이크 해제 상태 확인"
    - "구동기 입력 확인: ros2 topic echo /wheel_cmd 에 0이 아닌 명령이 나가는지"
    - "바퀴 주변 이물질·걸림 육안 확인 (전원 차단 후 손으로 돌려 보기)"
    - "구동 전원·모터 커넥터 체결 확인"
    - "모터·드라이버 교체 검토"

E102:
  name: 출력 저하
  level: WARN
  meaning: 실제 속도가 명령의 20~70%인 상태가 2초 이상 계속됨
  causes:
    - 배터리 전압 저하
    - 속도 제한 파라미터가 낮게 설정됨
    - 과적재, 경사, 바닥 마찰 증가
    - 모터 과열로 인한 출력 제한
    - 감속기·베어링 마모
  checks:
    - "상태 표시 확인: 배터리 잔량, 드라이버 경고, fault_injector mode"
    - "속도 제한 파라미터 확인 (최대 속도, 속도 오버라이드 %)"
    - "적재 무게와 바닥 상태(경사, 매트, 이물질) 확인"
    - "모터 온도 확인 (손등으로 또는 온도계)"
    - "바퀴 마모·공기압 확인"
    - "감속기·베어링 점검"

E103:
  name: 명령 전달 손실
  level: ALARM
  meaning: 최근 2초 동안 구동기 입력(/wheel_cmd) 수가 상위 명령(/cmd_vel) 수의 70% 미만
  causes:
    - 중간 노드(fault_injector 등)의 처리 지연·멈춤
    - CPU 과부하
    - 통신 품질 저하 (무선, 네트워크 부하)
    - QoS 불일치 (Reliability, Durability)
    - 통신 케이블·커넥터 접촉 불량
  checks:
    - "상태 표시 확인: 중간 노드 실행 여부(ros2 node list), fault_injector mode"
    - "수신 주기 비교: ros2 topic hz /cmd_vel 과 /wheel_cmd"
    - "CPU 사용률 확인: top"
    - "QoS 확인: ros2 topic info -v /wheel_cmd"
    - "네트워크·통신 케이블 확인"

E104:
  name: 방향 이탈
  level: WARN
  meaning: 직진 명령인데 실제 회전 속도가 0.15 rad/s를 넘는 상태가 1.5초 이상 계속됨
  causes:
    - 좌우 바퀴 마모·공기압 차이
    - 한쪽 바퀴 이물질 또는 브레이크 끌림
    - 바퀴 지름·간격 파라미터 오차
    - 좌우 모터 출력 불균형
    - 바닥 경사
  checks:
    - "상태 표시 확인: 드라이버 경고, fault_injector mode"
    - "바닥 경사·이물질 확인"
    - "좌우 바퀴 육안 비교 (마모, 이물질, 공기압)"
    - "바퀴 지름·간격 파라미터 확인"
    - "좌우 엔코더 값 비교 (같은 명령에 같은 회전수인지)"
    - "모터·드라이버 교체 검토"

# ===================== 2층 (※ 등급·점검 순서는 초안, 건형 확인 후 확정) =====================

E301:
  name: 팔 펼침 중 주행 차단
  level: WARN
  meaning: 팔이 접힘(stowed)에 도달하지 않았는데 주행 명령이 들어와 인터락이 주행을 막음
  causes:
    - 작업 후 팔을 접지 않고 이동 명령을 냄 (작업 순서 오류)
    - 팔이 접힘 자세 도달 전에 다음 명령이 나감 (대기 조건 누락)
    - 팔 상태 신호가 끊김 (arm_controller 멈춤)
  checks:
    - "상태 표시 확인: 팔 자세·상태(ros2 topic echo /arm/state)"
    - "작업 순서 확인: 이동 전에 stowed 요청이 있는지"
    - "팔을 접은 뒤 다시 주행 (ros2 topic pub --once /arm/pose_request std_msgs/String \"{data: stowed}\")"
    - "arm_controller 노드 실행 여부 확인"

E302:
  name: 주행 중 팔 요청 거부
  level: WARN
  meaning: 주행 명령이 있거나 실제로 움직이는 중에 팔 동작 요청이 들어와 인터락이 거부함
  causes:
    - 도착 전에 팔 동작을 요청함 (작업 순서 오류)
    - 정지 명령 후 관성으로 아직 움직이는 중
    - 명령원이 정지 명령을 보내지 않음 (마지막 주행 명령이 남아 있음)
  checks:
    - "상태 표시 확인: 주행 명령(/cmd_vel)과 실제 속도(/odom)"
    - "작업 순서 확인: 도착·정지 확인 후 팔 요청을 내는지"
    - "로봇이 완전히 멈춘 뒤 다시 요청"

E303:
  name: 팔 도달 시간 초과
  level: ALARM
  meaning: 팔이 요청한 자세에 8초 안에 도달하지 못함
  causes:
    - 관절이 걸림 (주변 물체, 케이블)
    - 목표 각도가 관절 한계 밖
    - 관절 모터 출력 부족·과열, 제어 게인 부족
    - 관절 상태 신호 끊김 (/joint_states)
  checks:
    - "상태 표시 확인: 팔 상태와 오차(ros2 topic echo /arm/state)"
    - "팔 주변 걸림 물체 육안 확인"
    - "목표 자세 각도가 관절 한계 안인지 확인 (config/arm_poses.yaml, URDF limit)"
    - "관절 상태 수신 확인: ros2 topic hz /joint_states"
    - "관절 모터·감속기 점검"
