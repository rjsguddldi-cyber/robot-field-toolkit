# robot-field-toolkit 알람 코드표
# 형식: 코드 -> name, level, meaning, causes(원인 목록), checks(점검 순서, 돈·시간 안 드는 것부터)
# level (두산 협동로봇 정지 방식):
#   WARN      = 정지 안 함, 기록하고 계속
#   ALARM     = Soft Stop: 감속 정지 후 점검
#   EMERGENCY = Quick Stop: 즉시 정지, 수동 복구
# checks의 1번은 항상 "상태 표시 확인".
# 등급·점검 순서 확정: 11/20 (건형)

E101:
  name: 구동 정지
  level: ALARM
  meaning: 주행 명령이 있는데 실제 속도가 명령의 20% 미만인 상태가 1초 이상 계속됨
  causes:
    - 브레이크 미해제
    - 바퀴 고착 또는 이물질 끼임
    - 모터 드라이버 비활성 (서보 OFF, 비상정지 래치)
    - 구동기에 0 명령이 들어감 (상위 명령이 중간에서 바뀜)
    - 구동 전원 또는 모터 케이블 단선
  checks:
    - "상태 표시 확인: 드라이버 LED·에러 코드, 비상정지 버튼, fault_injector mode"
    - "브레이크 해제 상태 확인"
    - "구동기 입력 확인: ros2 topic echo /wheel_cmd 에 0이 아닌 명령이 나가는지"
    - "바퀴 주변 이물질·걸림 육안 확인 (전원 차단 후 손으로 돌려 보기)"
    - "구동 전원·모터 커넥터 체결 확인"
    - "모터·드라이버 교체 검토"

E102:
  name: 출력 저하
  level: WARN
  meaning: 실제 속도가 명령의 20~70%인 상태가 2초 이상 계속됨
  causes:
    - 배터리 전압 저하
    - 속도 제한 파라미터가 낮게 설정됨
    - 과적재, 경사, 바닥 마찰 증가
    - 모터 과열로 인한 출력 제한
    - 감속기·베어링 마모
  checks:
    - "상태 표시 확인: 배터리 잔량, 드라이버 경고, fault_injector mode"
    - "속도 제한 파라미터 확인 (최대 속도, 속도 오버라이드 %)"
    - "적재 무게와 바닥 상태(경사, 매트, 이물질) 확인"
    - "모터 온도 확인 (손등으로 또는 온도계)"
    - "바퀴 마모·공기압 확인"
    - "감속기·베어링 점검"

E103:
  name: 명령 전달 손실
  level: ALARM
  meaning: 최근 2초 동안 구동기 입력(/wheel_cmd) 수가 상위 명령(/cmd_vel) 수의 70% 미만
  causes:
    - 중간 노드(fault_injector 등)의 처리 지연·멈춤
    - CPU 과부하
    - 통신 품질 저하 (무선, 네트워크 부하)
    - QoS 불일치 (Reliability, Durability)
    - 통신 케이블·커넥터 접촉 불량
  checks:
    - "상태 표시 확인: 중간 노드 실행 여부(ros2 node list), fault_injector mode"
    - "수신 주기 비교: ros2 topic hz /cmd_vel 과 /wheel_cmd"
    - "CPU 사용률 확인: top"
    - "QoS 확인: ros2 topic info -v /wheel_cmd"
    - "네트워크·통신 케이블 확인"

E104:
  name: 방향 이탈
  level: WARN
  meaning: 직진 명령인데 실제 회전 속도가 0.15 rad/s를 넘는 상태가 1.5초 이상 계속됨
  causes:
    - 좌우 바퀴 마모·공기압 차이
    - 한쪽 바퀴 이물질 또는 브레이크 끌림
    - 바퀴 지름·간격 파라미터 오차
    - 좌우 모터 출력 불균형
    - 바닥 경사
  checks:
    - "상태 표시 확인: 드라이버 경고, fault_injector mode"
    - "바닥 경사·이물질 확인"
    - "좌우 바퀴 육안 비교 (마모, 이물질, 공기압)"
    - "바퀴 지름·간격 파라미터 확인"
    - "좌우 엔코더 값 비교 (같은 명령에 같은 회전수인지)"
    - "모터·드라이버 교체 검토"

E105:
  name: 바퀴 헛돎
  level: ALARM
  meaning: 바퀴 기반 odom은 2초 동안 15cm 이상 움직였는데 LiDAR 스캔 변화는 3cm 미만. 위치 재설정 전까지 유지하고 팔 작업을 막음
  causes:
    - 장애물·벽에 막혀 바퀴만 돎
    - 바닥 오염 (기름, 물, 먼지, 비닐)
    - 타이어 마모·경화, 이물질
    - 적재물·팔 자세로 무게중심이 옮겨져 구동 바퀴 접지력 감소
    - 급가속·급감속
  checks:
    - "상태 표시 확인: 로봇 주변 걸림 여부, 알람 이력에서 같은 장소 반복인지"
    - "로봇을 장애물에서 빼고 rviz2 2D Pose Estimate로 위치 재설정 (알람 해제)"
    - "그 구간 바닥 청소 (기름, 물, 먼지)"
    - "바퀴 이물질 제거, 표면 확인"
    - "적재 무게와 팔 자세(무게중심) 확인"
    - "가감속·구역 속도 제한 낮추기"
    - "타이어 교체 검토"

# ===================== 2층 (※ 등급·점검 순서는 초안, 건형 확인 후 확정) =====================

E201:
  name: 센서 가림
  level: ALARM
  meaning: LiDAR 유효 거리값 비율이 60% 미만인 상태가 2초 이상 계속됨
  causes:
    - 센서 창 오염 (먼지, 기름, 지문)
    - 센서 앞을 가리는 물체 (팔 자세, 적재물, 케이블)
    - 센서 장착 위치·각도 틀어짐
    - 넓게 트인 공간 (측정 범위 밖이 많음)
  checks:
    - "상태 표시 확인: scan_fault_injector mode, 팔 자세(/arm/state)"
    - "rviz2에서 스캔이 비는 방향 확인 (어느 쪽이 가려졌는지)"
    - "센서 앞 가림 물체 확인 (팔, 적재물, 케이블)"
    - "센서 창 청소"
    - "센서 장착 볼트·각도 확인"
    - "센서 교체 검토"

E202:
  name: 센서 끊김
  level: ALARM
  meaning: LiDAR 수신 주기가 5Hz 미만이거나 1초 넘게 수신이 없음 (정상 약 10Hz)
  causes:
    - 센서 전원 또는 통신 케이블 접촉 불량
    - 드라이버 노드 멈춤·재시작
    - CPU 과부하로 처리 지연
    - 네트워크 대역폭 부족
  checks:
    - "상태 표시 확인: 센서 LED, scan_fault_injector mode, 드라이버 노드 실행 여부"
    - "수신 주기 확인: ros2 topic hz /scan --window 20"
    - "CPU 사용률 확인: top"
    - "센서 전원·통신 커넥터 체결 확인"
    - "드라이버 노드 재시작"
    - "케이블·센서 교체 검토"

E301:
  name: 팔 펼침 중 주행 차단
  level: WARN
  meaning: 팔이 접힘(stowed)에 도달하지 않았는데 주행 명령이 들어와 인터락이 주행을 막음
  causes:
    - 작업 후 팔을 접지 않고 이동 명령을 냄 (작업 순서 오류)
    - 팔이 접힘 자세 도달 전에 다음 명령이 나감 (대기 조건 누락)
    - 팔 상태 신호가 끊김 (arm_controller 멈춤)
  checks:
    - "상태 표시 확인: 팔 자세·상태(ros2 topic echo /arm/state)"
    - "작업 순서 확인: 이동 전에 stowed 요청이 있는지"
    - "팔을 접은 뒤 다시 주행 (ros2 topic pub --once /arm/pose_request std_msgs/String \"{data: stowed}\")"
    - "arm_controller 노드 실행 여부 확인"

E302:
  name: 주행 중 팔 요청 거부
  level: WARN
  meaning: 주행 명령이 있거나 실제로 움직이는 중에 팔 동작 요청이 들어와 인터락이 거부함
  causes:
    - 도착 전에 팔 동작을 요청함 (작업 순서 오류)
    - 정지 명령 후 관성으로 아직 움직이는 중
    - 명령원이 정지 명령을 보내지 않음 (마지막 주행 명령이 남아 있음)
  checks:
    - "상태 표시 확인: 주행 명령(/cmd_vel)과 실제 속도(/odom)"
    - "작업 순서 확인: 도착·정지 확인 후 팔 요청을 내는지"
    - "로봇이 완전히 멈춘 뒤 다시 요청"

E303:
  name: 팔 도달 시간 초과
  level: ALARM
  meaning: 팔이 요청한 자세에 8초 안에 도달하지 못함
  causes:
    - 관절이 걸림 (주변 물체, 케이블)
    - 목표 각도가 관절 한계 밖
    - 관절 모터 출력 부족·과열, 제어 게인 부족
    - 관절 상태 신호 끊김 (/joint_states)
  checks:
    - "상태 표시 확인: 팔 상태와 오차(ros2 topic echo /arm/state)"
    - "팔 주변 걸림 물체 육안 확인"
    - "목표 자세 각도가 관절 한계 안인지 확인 (config/arm_poses.yaml, URDF limit)"
    - "관절 상태 수신 확인: ros2 topic hz /joint_states"
    - "관절 모터·감속기 점검"

E401:
  name: 작업 지점 도착 오차 초과
  level: WARN
  meaning: 목표 도착 후 실제 위치와 목표의 차이가 10cm 또는 8.6도(0.15rad)를 넘음. 팔 작업 금지 신호를 냄
  causes:
    - 주행 목표 허용 오차(Nav2 goal checker)가 팔 작업에 비해 큼
    - 위치 추정(AMCL) 오차
    - 바퀴 미끄러짐, 구동 출력 저하
    - 지도와 실제 환경이 다름
  checks:
    - "상태 표시 확인: 도착 오차 값(/diagnostics detail), 위치 추정 상태(E402 여부)"
    - "같은 지점을 다시 접근해서 재현되는지 확인"
    - "Nav2 goal checker 허용 오차 확인 (xy_goal_tolerance, yaw_goal_tolerance)"
    - "지도와 실제 환경 비교 (가구 이동 등)"
    - "바퀴·구동 점검 (E1xx 이력 확인)"

E402:
  name: 위치 상실
  level: ALARM
  meaning: AMCL 위치 표준편차가 0.35m 또는 방향 0.45rad를 넘는 상태가 2초 이상 계속됨
  causes:
    - LiDAR 가림·끊김 (E201, E202)
    - 특징 없는 공간 (긴 복도, 빈 공간)
    - 지도와 실제 환경이 다름
    - 바퀴 미끄러짐·충돌로 위치가 갑자기 바뀜
  checks:
    - "상태 표시 확인: E201·E202 동시 발생 여부, rviz2 파티클 퍼짐"
    - "LiDAR 상태 확인 (가림, 주기)"
    - "로봇을 특징 있는 곳으로 옮기고 2D Pose Estimate로 위치 재설정"
    - "지도 갱신 검토 (SLAM 다시)"

E403:
  name: 경로 차단
  level: ALARM
  meaning: 목표로 가는 중 복구 동작이 3회 이상이거나, 15초 동안 남은 거리가 0.2m도 줄지 않음
  causes:
    - 통로가 장애물로 막힘
    - 좁은 통로에서 경로를 못 찾음 (팽창 반경 대비 통로 폭)
    - 위치 상실로 엉뚱한 경로 (E402)
    - 구동 이상으로 못 움직임 (E1xx)
  checks:
    - "상태 표시 확인: E402·E1xx 동시 발생 여부, rviz2 경로와 costmap"
    - "통로의 장애물 확인·제거"
    - "통로 폭과 팽창 반경(inflation_radius) 비교"
    - "목표를 다시 보내 재현 확인"
